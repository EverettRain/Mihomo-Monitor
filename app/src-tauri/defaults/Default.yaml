# Mihomo-Monitor 规则配置：域名分组与归属规则。
# 条目写法与 Clash 规则相同：DOMAIN-SUFFIX、DOMAIN、DOMAIN-KEYWORD、IP-CIDR，也可以只写域名（含子域名）。
